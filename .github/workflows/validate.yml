name: Validate contribution

# Runs on pull requests, and on demand. Deliberately **not** on push:
# authors validate locally while they work — `python scripts/validate.py
# --watch` re-runs the same three checks on every save — so CI stays off
# each individual commit and runs once per PR instead.
#
# This job is the merge gate. Mark `validate` as a required status check
# in branch protection so a red run blocks the merge; without that, a
# failure here is only advisory.
#
# Dispatch it manually to check a branch before opening a PR, or when a
# reviewer wants an independent result in a clean 3.12 environment.

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      # Same entrypoint authors run locally, so a green local run and a
      # green CI run mean the same thing. --no-color keeps the log plain.
      - name: Validate
        run: python scripts/validate.py --no-color
