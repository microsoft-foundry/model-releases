# WWI Policy-Adherence Eval Rubric (Adaptive Evals)
#
# This rubric evaluates whether AI responses correctly apply WWI
# policy rules. Adaptive rules shift scoring emphasis based on the type
# of question being asked — budget questions demand exact numbers, edge
# cases demand hallucination detection, etc.
#
# Usage:
#   - Pair with the prompt-based evaluator in policy_adherence_evaluator.py
#   - The evaluator reads this file and applies adaptive weight adjustments
#   - Register in Foundry via the SDK (see Lab 4 instructions)

name: "wwi_policy_adherence_eval"
description: "Evaluates whether AI responses correctly apply WWI policy rules with context-adaptive scoring."
version: 1.0

criteria:
  - id: rule_accuracy
    description: "Does the response cite the correct policy rule for the question asked?"
    scale: 1-5
    weight: 0.35
    scoring_guide:
      5: "Cites the exact correct policy section and rule"
      4: "Correct rule, minor section reference error"
      3: "Partially correct — misses a related rule that applies"
      2: "Cites a wrong rule or conflates two different rules"
      1: "Completely wrong rule or no policy reference at all"

  - id: completeness
    description: "Are all relevant conditions, exceptions, and approval requirements mentioned?"
    scale: 1-5
    weight: 0.25
    scoring_guide:
      5: "All conditions, exceptions, and approval requirements included"
      4: "Missing one minor condition that rarely applies"
      3: "Missing a significant condition (e.g., approval threshold)"
      2: "Only mentions the base rule, ignores exceptions entirely"
      1: "Answer is a fragment with no useful policy detail"

  - id: boundary_precision
    description: "Are dollar amounts, day counts, percentage thresholds, and approval levels exact?"
    scale: 1-5
    weight: 0.25
    scoring_guide:
      5: "All dollar amounts, day counts, percentages match the policy exactly"
      4: "One number is approximate but within 5% of correct"
      3: "One number is wrong or a threshold is described vaguely"
      2: "Multiple numbers are wrong or fabricated"
      1: "No specific numbers given when the policy has them"

  - id: hallucination_absence
    description: "Does the response avoid inventing rules, limits, or exceptions not in the policy?"
    scale: 1-5
    weight: 0.15
    scoring_guide:
      5: "Every claim is traceable to the policy document — nothing invented"
      4: "One minor implication that's reasonable but not stated in policy"
      3: "One fabricated rule or limit that sounds plausible but isn't in the policy"
      2: "Multiple invented rules mixed with real ones"
      1: "Largely fabricated response with minimal basis in the actual policy"

adaptive_rules:
  # Budget/limit questions: boundary precision matters most
  # (wrong dollar amounts = wrong reimbursement decisions)
  - condition: "input.category == 'budget_cap' or input.category == 'reimbursement' or input.category == 'receipt_expense'"
    adjust_weights:
      rule_accuracy: 0.25
      completeness: 0.20
      boundary_precision: 0.40
      hallucination_absence: 0.15
    rationale: "Budget questions hinge on exact numbers — $325 vs $300 determines approval."

  # Exception/approval-chain questions: completeness matters most
  # (missing an approval step = process failure)
  - condition: "input.category == 'exception' or input.category == 'approval_chain'"
    adjust_weights:
      rule_accuracy: 0.30
      completeness: 0.40
      boundary_precision: 0.15
      hallucination_absence: 0.15
    rationale: "Missing an approval step or exception condition blocks the traveler."

  # Edge cases: hallucination risk is highest
  # (ambiguous scenarios tempt models to invent plausible-sounding rules)
  - condition: "input.category == 'edge_case'"
    adjust_weights:
      rule_accuracy: 0.25
      completeness: 0.20
      boundary_precision: 0.15
      hallucination_absence: 0.40
    rationale: "Ambiguous scenarios are where models most often fabricate rules."

  # Simple FAQ: rule accuracy is sufficient
  # (straightforward lookups — if you get the rule right, you're done)
  - condition: "input.category == 'simple_faq'"
    adjust_weights:
      rule_accuracy: 0.45
      completeness: 0.25
      boundary_precision: 0.20
      hallucination_absence: 0.10
    rationale: "Simple lookups — getting the right rule is 90% of the answer."

scoring:
  method: weighted_average
  pass_threshold: 3.5
  fail_action: "flag_for_review"
